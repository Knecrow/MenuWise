<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="topbar">
    <div class="topbar-left">
        <div class="restaurant-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                <line x1="6" x2="18" y1="17" y2="17"/>
            </svg>
            MenuWise
        </div>
    </div>

    <div class="topbar-right">
        <div class="live-clock" id="liveClock">00:00</div>

        <button class="notification-bell" title="Alerts">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
            <span class="notification-badge">3</span>
        </button>

        <!-- Avatar -->
        <div style="width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#818cf8);
                    display:flex; align-items:center; justify-content:center; font-size:0.75rem;
                    font-weight:800; color:#fff; cursor:pointer; border:2px solid rgba(255,255,255,0.15);"
             title="Cashier">C</div>
    </div>

    <script>
        function updateLiveClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();
    </script>
</header>

</body>
</html>
