<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="topbar">
    <div class="topbar-left">
        <div class="restaurant-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a8b58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                <line x1="6" x2="18" y1="17" y2="17"/>
            </svg>
            MenuWise
        </div>
    </div>

    <div class="topbar-right">
        <div class="live-clock" id="liveClock">
            Loading time...
        </div>

        <button class="notification-bell" title="Alerts">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
            <span class="notification-badge">3</span>
        </button>
    </div>

    <script>
        function updateLiveClock() {
            const now = new Date();
            const clockElem = document.getElementById('liveClock');
            if (clockElem) {
                clockElem.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();
    </script>
</header>

</body>
</html>
