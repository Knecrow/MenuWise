<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Analytics', 'analytics')}">
<body>
<div th:fragment="mainContent">

    <div class="sub-header-bar">
        <div class="sub-header-left">
            <h1 class="sub-header-title">Margin Analytics</h1>
        </div>
        <div class="sub-header-right">
            <div class="date-range-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
                </svg>
                <span>Last 7 Days</span>
            </div>
            <a th:href="@{/pos}" class="btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Order
            </a>
        </div>
    </div>

    <!-- 4 Purposeful Stat Tiles -->
    <div class="grid-stats">
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Weekly Revenue</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="anWeeklyRev">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Weekly Orders</span>
                <div class="card-stat-icon" style="color:#3b82f6; background:#eff6ff;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="anWeeklyOrders">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Avg Order Value</span>
                <div class="card-stat-icon" style="color:#10b981; background:#dcfce7;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="anAvgOrder">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Best Day</span>
                <div class="card-stat-icon" style="color:#0f172a; background:#f1f5f9;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="anBestDay">—</div>
        </div>
    </div>

    <!-- Charts Row -->
    <div style="display:grid; grid-template-columns: 1.6fr 1fr; gap:1.25rem; margin-bottom:1.25rem;">
        <div class="card-panel">
            <div class="card-panel-header">
                <h3 class="card-panel-title">Daily Revenue (Last 7 Days)</h3>
                <span class="badge-growth">Live Sales</span>
            </div>
            <div style="height:210px; position:relative;">
                <canvas id="barRevenueChart"></canvas>
            </div>
        </div>

        <div class="card-panel">
            <div class="card-panel-header">
                <h3 class="card-panel-title">Margin by Category</h3>
                <a th:href="@{/simulator}" class="card-arrow-btn" title="Simulate Pricing">↗</a>
            </div>
            <div style="height:210px; position:relative;">
                <canvas id="marginPieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Top Items Table + Orders Volume Row -->
    <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:1.25rem;">
        <div class="card-panel" style="padding:0; overflow:hidden;">
            <div style="padding:1rem 1.35rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.05);">
                <h3 class="card-panel-title" style="margin:0;">Top Selling Items</h3>
                <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">Verified Orders</span>
            </div>
            <div class="table-responsive">
                <table class="calescence-table">
                    <thead>
                        <tr>
                            <th style="width:50px;">Rank</th>
                            <th>Item Name</th>
                            <th>Sold</th>
                            <th style="text-align:right;">Gross Revenue</th>
                        </tr>
                    </thead>
                    <tbody id="topItemsBody">
                        <tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-panel">
            <div class="card-panel-header">
                <h3 class="card-panel-title">Daily Order Volume</h3>
                <span class="badge-lime">7-Day Curve</span>
            </div>
            <div style="height:200px; position:relative;">
                <canvas id="ordersLineChart"></canvas>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', loadAnalytics);

async function loadAnalytics() {
    try {
        const [trend, topItems, margins] = await Promise.all([
            fetch('/api/v1/analytics/revenue-trend').then(r => r.json()),
            fetch('/api/v1/analytics/top-items').then(r => r.json()),
            fetch('/api/v1/analytics/margin-by-category').then(r => r.json())
        ]);

        const totalRev    = trend.reduce((s, d) => s + d.revenue, 0);
        const totalOrders = trend.reduce((s, d) => s + d.orderCount, 0);
        const bestDay     = trend.reduce((best, d) => d.revenue > best.revenue ? d : best, trend[0] || {});

        document.getElementById('anWeeklyRev').textContent    = `৳ ${Math.round(totalRev).toLocaleString()}`;
        document.getElementById('anWeeklyOrders').textContent = totalOrders;
        document.getElementById('anAvgOrder').textContent     = totalOrders > 0 ? `৳ ${Math.round(totalRev/totalOrders).toLocaleString()}` : '৳ 0';
        document.getElementById('anBestDay').textContent      = bestDay.dayLabel || '—';

        // Bar Chart — Revenue (Royal blue pill bars)
        new Chart(document.getElementById('barRevenueChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: trend.map(d => d.dayLabel),
                datasets: [{
                    label: 'Revenue ৳',
                    data: trend.map(d => d.revenue),
                    backgroundColor: trend.map((d, i) => i === trend.length - 1 ? '#3b82f6' : 'rgba(59, 130, 246, 0.35)'),
                    borderRadius: 9999,
                    borderSkipped: false,
                    barPercentage: 0.55
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)', borderDash: [4, 4] }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11, weight: '600' } } }
                }
            }
        });

        // Doughnut — Margin by Category
        new Chart(document.getElementById('marginPieChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: margins.map(m => m.category),
                datasets: [{
                    data: margins.map(m => m.marginPercentage),
                    backgroundColor: ['#0f172a', '#c8f53c', '#3b82f6', '#f43f5e'],
                    borderWidth: 0,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: '68%',
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 12, color: '#64748b', font: { size: 11, weight: '600' } } }
                }
            }
        });

        // Line Chart — Orders volume
        new Chart(document.getElementById('ordersLineChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: trend.map(d => d.dayLabel),
                datasets: [{
                    label: 'Orders',
                    data: trend.map(d => d.orderCount),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.08)',
                    fill: true, tension: 0.4,
                    pointBackgroundColor: '#3b82f6', pointRadius: 3
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 } } }
                }
            }
        });

        // Top Items Table
        const medals = ['🥇','🥈','🥉'];
        document.getElementById('topItemsBody').innerHTML = topItems.length > 0
            ? topItems.map((item, i) => `
                <tr>
                    <td style="font-size:1.1rem; text-align:center;">${medals[i] || (i+1)}</td>
                    <td style="font-weight:700; color:var(--text-main); font-size:0.88rem;">${item.itemName}</td>
                    <td><span class="badge-growth">${item.quantitySold} sold</span></td>
                    <td style="font-weight:800; color:var(--text-main); text-align:right;">৳ ${Math.round(item.revenue).toLocaleString()}</td>
                </tr>`).join('')
            : `<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-muted);">No orders placed yet.</td></tr>`;

    } catch(e) {
        console.error('Analytics load failed:', e);
        renderFallbackCharts();
    }
}

function renderFallbackCharts() {
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const rev  = [32000,38000,41000,39000,48000,56000,42500];
    const ord  = [18,21,24,22,27,31,25];

    document.getElementById('anWeeklyRev').textContent    = '৳ 296,500';
    document.getElementById('anWeeklyOrders').textContent = '168';
    document.getElementById('anAvgOrder').textContent     = '৳ 1,765';
    document.getElementById('anBestDay').textContent      = 'Sat';

    new Chart(document.getElementById('barRevenueChart').getContext('2d'), {
        type:'bar', data:{ labels:days, datasets:[{ data:rev, backgroundColor: days.map((_,i)=>i===5?'#3b82f6':'rgba(59, 130, 246, 0.35)'), borderRadius:9999, barPercentage:0.55 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(0,0,0,0.04)',borderDash:[4,4]}},x:{grid:{display:false}}}}
    });
    new Chart(document.getElementById('marginPieChart').getContext('2d'), {
        type:'doughnut', data:{ labels:['Mains','Starters','Beverages','Desserts'], datasets:[{data:[65,72,85,78], backgroundColor:['#0f172a','#c8f53c','#3b82f6','#f43f5e'], borderWidth:0}]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11,weight:'600'}}}}}
    });
    new Chart(document.getElementById('ordersLineChart').getContext('2d'), {
        type:'line', data:{labels:days, datasets:[{data:ord,borderColor:'#3b82f6',backgroundColor:'rgba(59, 130, 246, 0.08)',fill:true,tension:0.4,pointRadius:3}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{display:false},x:{grid:{display:false}}}}
    });
    document.getElementById('topItemsBody').innerHTML = `<tr><td colspan="4" style="text-align:center;padding:1.5rem;color:var(--text-muted);">Place orders via POS to see live data</td></tr>`;
}
</script>
</div>
</body>
</html>
