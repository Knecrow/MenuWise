<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Analytics', 'analytics')}">
<body>
<div th:fragment="mainContent">

    <div class="page-header">
        <h1 class="page-title">Margin Analytics</h1>
        <p class="page-subtitle">Revenue trends, margin breakdown &amp; top-performing dishes from real order data</p>
    </div>

    <!-- Summary Tiles -->
    <div class="grid-stats">
        <div class="card-stat">
            <div class="card-stat-header"><span class="card-stat-title">Weekly Revenue</span><div class="card-stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div>
            <div class="card-stat-value" id="anWeeklyRev">—</div>
        </div>
        <div class="card-stat">
            <div class="card-stat-header"><span class="card-stat-title">Weekly Orders</span><div class="card-stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div></div>
            <div class="card-stat-value" id="anWeeklyOrders">—</div>
        </div>
        <div class="card-stat">
            <div class="card-stat-header"><span class="card-stat-title">Avg Order Value</span><div class="card-stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div></div>
            <div class="card-stat-value" id="anAvgOrder">—</div>
        </div>
        <div class="card-stat">
            <div class="card-stat-header"><span class="card-stat-title">Best Day</span><div class="card-stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></div></div>
            <div class="card-stat-value" id="anBestDay">—</div>
        </div>
    </div>

    <!-- Charts Row -->
    <div style="display:grid; grid-template-columns:1.5fr 1fr; gap:1rem; margin-bottom:1rem;">
        <div class="panel" style="margin-bottom:0;">
            <div class="panel-header"><h2 class="panel-title">Daily Revenue (Last 7 Days)</h2></div>
            <div style="height:200px;"><canvas id="barRevenueChart"></canvas></div>
        </div>
        <div class="panel" style="margin-bottom:0;">
            <div class="panel-header"><h2 class="panel-title">Margin by Category</h2></div>
            <div style="height:200px;"><canvas id="marginPieChart"></canvas></div>
        </div>
    </div>

    <!-- Top Items Table + Orders Chart Row -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="panel" style="margin-bottom:0; padding:0; overflow:hidden;">
            <div style="padding:0.75rem 1.15rem; border-bottom:1px solid var(--border-color);">
                <h2 class="panel-title">Top Selling Items</h2>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead><tr><th>#</th><th>Item</th><th>Sold</th><th>Revenue</th></tr></thead>
                    <tbody id="topItemsBody">
                        <tr><td colspan="4" style="text-align:center;padding:1.5rem;color:var(--text-muted);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel" style="margin-bottom:0;">
            <div class="panel-header"><h2 class="panel-title">Daily Order Volume</h2></div>
            <div style="height:190px;"><canvas id="ordersLineChart"></canvas></div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', loadAnalytics);

async function loadAnalytics() {
    try {
        const [trend, topItems, margins] = await Promise.all([
            fetch('/api/v1/analytics/revenue-trend').then(r => r.json()),
            fetch('/api/v1/analytics/top-items').then(r => r.json()),
            fetch('/api/v1/analytics/margin-by-category').then(r => r.json())
        ]);

        const totalRev    = trend.reduce((s, d) => s + d.revenue, 0);
        const totalOrders = trend.reduce((s, d) => s + d.orderCount, 0);
        const bestDay     = trend.reduce((best, d) => d.revenue > best.revenue ? d : best, trend[0] || {});

        document.getElementById('anWeeklyRev').textContent    = `৳ ${Math.round(totalRev).toLocaleString()}`;
        document.getElementById('anWeeklyOrders').textContent = totalOrders;
        document.getElementById('anAvgOrder').textContent     = totalOrders > 0 ? `৳ ${Math.round(totalRev/totalOrders).toLocaleString()}` : '৳ 0';
        document.getElementById('anBestDay').textContent      = bestDay.dayLabel || '—';

        // Bar Chart — Revenue
        new Chart(document.getElementById('barRevenueChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: trend.map(d => d.dayLabel),
                datasets: [{
                    label: 'Revenue ৳',
                    data: trend.map(d => d.revenue),
                    backgroundColor: trend.map((d, i) => i === trend.length - 1 ? '#6366f1' : 'rgba(99,102,241,0.35)'),
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#6b7280', font: { size: 11 } } }, x: { grid: { display: false }, ticks: { color: '#6b7280', font: { size: 11 } } } }
            }
        });

        // Doughnut — Margin by Category
        new Chart(document.getElementById('marginPieChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: margins.map(m => m.category),
                datasets: [{
                    data: margins.map(m => m.marginPercentage),
                    backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#0ea5e9'],
                    borderWidth: 0,
                    hoverOffset: 6
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: '62%',
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 16, color: '#6b7280', font: { size: 11 } } }
                }
            }
        });

        // Line Chart — Orders volume
        new Chart(document.getElementById('ordersLineChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: trend.map(d => d.dayLabel),
                datasets: [{
                    label: 'Orders',
                    data: trend.map(d => d.orderCount),
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99,102,241,0.1)',
                    fill: true, tension: 0.4,
                    pointBackgroundColor: '#6366f1', pointRadius: 4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#6b7280', font: { size: 11 } } }, x: { grid: { display: false }, ticks: { color: '#6b7280', font: { size: 11 } } } }
            }
        });

        // Top Items Table
        const medals = ['🥇','🥈','🥉'];
        document.getElementById('topItemsBody').innerHTML = topItems.length > 0
            ? topItems.map((item, i) => `
                <tr>
                    <td style="font-size:1rem;">${medals[i] || (i+1)}</td>
                    <td style="font-weight:700;">${item.itemName}</td>
                    <td><span class="badge-info">${item.quantitySold}</span></td>
                    <td style="font-weight:700; color:#10b981;">৳ ${Math.round(item.revenue).toLocaleString()}</td>
                </tr>`).join('')
            : `<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-muted);">No orders placed yet.<br><small>Use the POS to place orders.</small></td></tr>`;

    } catch(e) {
        console.error('Analytics load failed:', e);
        renderFallbackCharts();
    }
}

function renderFallbackCharts() {
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const rev  = [32000,38000,41000,39000,48000,56000,42500];
    const ord  = [18,21,24,22,27,31,25];

    document.getElementById('anWeeklyRev').textContent    = '৳ 296,500';
    document.getElementById('anWeeklyOrders').textContent = '168';
    document.getElementById('anAvgOrder').textContent     = '৳ 1,765';
    document.getElementById('anBestDay').textContent      = 'Sat';

    new Chart(document.getElementById('barRevenueChart').getContext('2d'), {
        type:'bar', data:{ labels:days, datasets:[{ data:rev, backgroundColor: days.map((_,i)=>i===5?'#6366f1':'rgba(99,102,241,0.35)'), borderRadius:8 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}
    });
    new Chart(document.getElementById('marginPieChart').getContext('2d'), {
        type:'doughnut', data:{ labels:['Mains','Starters','Beverages','Desserts'], datasets:[{data:[65,72,85,78], backgroundColor:['#6366f1','#10b981','#f59e0b','#0ea5e9'], borderWidth:0}]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom',labels:{padding:16,font:{size:11}}}}}
    });
    new Chart(document.getElementById('ordersLineChart').getContext('2d'), {
        type:'line', data:{labels:days, datasets:[{data:ord,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,0.1)',fill:true,tension:0.4,pointRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}
    });
    document.getElementById('topItemsBody').innerHTML = `<tr><td colspan="4" style="text-align:center;padding:1.5rem;color:var(--text-muted);">Place orders via POS to see live data</td></tr>`;
}
</script>
</div>

</body>
</html>
