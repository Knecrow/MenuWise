<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Margin Analytics', 'analytics')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Analytics</h1>
    </div>

    <!-- Analytics Charts Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem;">
        <!-- Chart 1: Revenue Trend -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Revenue (7-Day)</h2>
            </div>
            <div style="height: 250px;">
                <canvas id="revenueTrendChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: Food Cost % Breakdown -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Cost Breakdown</h2>
            </div>
            <div style="height: 250px;">
                <canvas id="foodCostChart"></canvas>
            </div>
        </div>

        <!-- Chart 3: Profit Margin -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Profit Margin</h2>
            </div>
            <div style="height: 250px;">
                <canvas id="profitMarginChart"></canvas>
            </div>
        </div>

        <!-- Chart 4: Top Selling Items -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Top Items</h2>
            </div>
            <div style="height: 250px;">
                <canvas id="topSellingChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Chart.js Sample Script for Layout Demonstration -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Revenue Trend Chart
            const ctx1 = document.getElementById('revenueTrendChart')?.getContext('2d');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Revenue (৳)',
                            data: [32000, 38000, 41000, 39000, 48000, 56000, 42500],
                            borderColor: '#1e2024',
                            backgroundColor: 'rgba(212, 248, 38, 0.25)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Food Cost Chart
            const ctx2 = document.getElementById('foodCostChart')?.getContext('2d');
            if (ctx2) {
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Meat & Poultry', 'Dairy & Ghee', 'Polao Rice', 'Spices & Oil', 'Beverages'],
                        datasets: [{
                            data: [42, 20, 18, 12, 8],
                            backgroundColor: ['#1e2024', '#d4f826', '#475569', '#94a3b8', '#cbd5e1']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Profit Margin Chart
            const ctx3 = document.getElementById('profitMarginChart')?.getContext('2d');
            if (ctx3) {
                new Chart(ctx3, {
                    type: 'bar',
                    data: {
                        labels: ['Mains', 'Appetizers', 'Beverages', 'Desserts'],
                        datasets: [{
                            label: 'Margin %',
                            data: [65, 72, 85, 78],
                            backgroundColor: '#1e2024'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            // Top Selling Chart
            const ctx4 = document.getElementById('topSellingChart')?.getContext('2d');
            if (ctx4) {
                new Chart(ctx4, {
                    type: 'bar',
                    data: {
                        labels: ['Kacchi Biryani', 'Fish & Chips', 'Chicken Roast', 'Shepherd\'s Pie', 'Borhani'],
                        datasets: [{
                            label: 'Portions Sold',
                            data: [142, 98, 76, 115, 88],
                            backgroundColor: '#d4f826'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        });
    </script>
</div>

</body>
</html>
