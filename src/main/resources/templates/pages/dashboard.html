<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Dashboard', 'dashboard')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
    </div>

    <!-- Metric Cards Grid -->
    <div class="grid-stats">
        <!-- Card 1: Today's Revenue -->
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Revenue</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" x2="12" y1="2" y2="22"/>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
            </div>
            <div class="card-stat-value">৳ 42,500</div>
        </div>

        <!-- Card 2: Orders Today -->
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Orders</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                        <line x1="3" x2="21" y1="6" y2="6"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </svg>
                </div>
            </div>
            <div class="card-stat-value">128</div>
        </div>

        <!-- Card 3: Food Cost -->
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Food Cost</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                        <path d="M22 12A10 10 0 0 0 12 2v10z"/>
                    </svg>
                </div>
            </div>
            <div class="card-stat-value">28.4%</div>
        </div>

        <!-- Card 4: Low Stock Items -->
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Low Stock</span>
                <div class="card-stat-icon" style="background-color: var(--status-warning-bg); color: var(--status-warning-text);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                        <line x1="12" x2="12" y1="9" y2="13"/>
                        <line x1="12" x2="12.01" y1="17" y2="17"/>
                    </svg>
                </div>
            </div>
            <div class="card-stat-value">5 items</div>
        </div>
    </div>

    <!-- Recent Activity Feed -->
    <div class="panel">
        <div class="panel-header">
            <h2 class="panel-title">Recent Activity</h2>
            <button class="btn-secondary">View Log</button>
        </div>

        <div class="activity-feed">
            <div class="activity-item">
                <div class="activity-info">
                    <div class="activity-dot"></div>
                    <div class="activity-title">Order #1042 completed (Kacchi Biryani &amp; Borhani)</div>
                </div>
                <span class="activity-time">15m ago</span>
            </div>

            <div class="activity-item">
                <div class="activity-info">
                    <div class="activity-dot" style="background-color: var(--honey-500);"></div>
                    <div class="activity-title">Chinigura Polao Rice stock updated (+50 kg)</div>
                </div>
                <span class="activity-time">32m ago</span>
            </div>

            <div class="activity-item">
                <div class="activity-info">
                    <div class="activity-dot" style="background-color: var(--basil-500);"></div>
                    <div class="activity-title">Fish &amp; Chips added to Chef Specials</div>
                </div>
                <span class="activity-time">1h ago</span>
            </div>

            <div class="activity-item">
                <div class="activity-info">
                    <div class="activity-dot" style="background-color: #e05252;"></div>
                    <div class="activity-title">Pure Ghee / Mustard Oil low stock alert</div>
                </div>
                <span class="activity-time">2h ago</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
