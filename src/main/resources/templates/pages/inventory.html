<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Live Inventory', 'inventory')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Inventory</h1>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h2 class="panel-title">Ingredients</h2>
            <div style="display: flex; gap: 0.75rem;">
                <input type="text" placeholder="Search..." style="padding: 0.55rem 1.15rem; border: none; background-color: var(--bg-canvas); border-radius: 9999px; font-size: 0.875rem; color: var(--text-main);">
                <button class="btn-primary">+ Restock</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Stock</th>
                        <th>Unit</th>
                        <th>Min Level</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="font-weight: 600;">Chicken Breast</td>
                        <td>24.0</td>
                        <td>kg</td>
                        <td>10.0 kg</td>
                        <td><span class="badge-success">In Stock</span></td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600;">Tomatoes</td>
                        <td>8.0</td>
                        <td>kg</td>
                        <td>10.0 kg</td>
                        <td><span class="badge-warning">Low Stock</span></td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600;">Cooking Oil</td>
                        <td>4.0</td>
                        <td>L</td>
                        <td>5.0 L</td>
                        <td><span class="badge-warning">Low Stock</span></td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600;">Rice</td>
                        <td>45.0</td>
                        <td>kg</td>
                        <td>15.0 kg</td>
                        <td><span class="badge-success">In Stock</span></td>
                    </tr>
                    <tr>
                        <td style="font-weight: 600;">Cheese</td>
                        <td>2.0</td>
                        <td>kg</td>
                        <td>5.0 kg</td>
                        <td><span class="badge-danger">Critical</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
