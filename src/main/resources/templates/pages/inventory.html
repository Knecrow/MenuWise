<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Live Inventory', 'inventory')}">
<body>
<div th:fragment="mainContent">

    <div class="sub-header-bar">
        <div class="sub-header-left">
            <h1 class="sub-header-title">Live Inventory</h1>
        </div>
        <div class="sub-header-right">
            <div style="position:relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search ingredients..." oninput="filterTable()" style="padding: 0.45rem 0.85rem 0.45rem 2.2rem; border: 1px solid var(--border-color); background: #ffffff; border-radius: 9999px; font-size: 0.84rem; color: var(--text-main); outline: none; font-family: inherit; min-width: 200px;">
            </div>
            <select id="statusFilter" onchange="filterTable()" style="padding: 0.45rem 0.85rem; border: 1px solid var(--border-color); background: #ffffff; border-radius: 9999px; font-size: 0.84rem; color: var(--text-main); outline: none; font-family: inherit; cursor:pointer;">
                <option value="all">All Items</option>
                <option value="ok">In Stock</option>
                <option value="low">Low Stock</option>
                <option value="critical">Critical</option>
            </select>
            <button class="btn-primary" onclick="openAddModal()" id="addIngredientBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Ingredient
            </button>
        </div>
    </div>

    <!-- Alert Banner -->
    <div id="alertBanner" style="display:none; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 1rem; padding: 0.65rem 1.15rem; margin-bottom: 1rem; font-size: 0.84rem; font-weight: 700; color: #be123c; display: flex; align-items: center; gap: 0.5rem;">
        ⚠️ <span id="alertBannerText">Checking for alerts...</span>
    </div>

    <!-- 4 Purposeful Stat Tiles -->
    <div class="grid-stats">
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Total Items</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statTotalVal">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Low Stock</span>
                <div class="card-stat-icon" style="color:#f43f5e; background:#ffe4e6;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
            </div>
            <div class="card-stat-value" style="color:#f43f5e;" id="statLowVal">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Expiring Soon</span>
                <div class="card-stat-icon" style="color:#f59e0b; background:#fef3c7;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statExpiringVal">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Stock Value</span>
                <div class="card-stat-icon" style="color:#3b82f6; background:#eff6ff;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statValueVal">—</div>
        </div>
    </div>

    <!-- Inventory Table Card Panel -->
    <div class="card-panel" style="padding:0; overflow:hidden;">
        <div style="padding:1rem 1.35rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.05);">
            <h3 class="card-panel-title" style="margin:0;">Ingredients Catalog</h3>
            <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">Real-Time Pantry</span>
        </div>

        <div class="table-responsive">
            <table class="calescence-table" id="ingredientTable">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Current Stock</th>
                        <th>Unit</th>
                        <th>Min Level</th>
                        <th>Cost / Unit</th>
                        <th>Expiry</th>
                        <th>Status</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="ingredientTableBody">
                    <tr><td colspan="8" style="text-align:center; padding: 2.5rem; color:var(--text-muted);">
                        Loading ingredients...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div id="ingredientModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; opacity:0; transition: opacity 0.25s ease;" onclick="if(event.target===this) closeModal()">
        <div style="background:#fff; border-radius: 1.5rem; padding: 2rem; width: 100%; max-width: 480px; box-shadow: 0 24px 60px rgba(0,0,0,0.15); transform: translateY(12px); transition: transform 0.25s ease;" id="modalBox">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2 style="font-size:1.2rem; font-weight:800; color:var(--text-main);" id="modalTitle">Add Ingredient</h2>
                <button onclick="closeModal()" style="border:none; background:var(--bg-canvas); border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:1.1rem; color:var(--text-muted); display:flex; align-items:center; justify-content:center; transition:all 0.15s;" onmouseover="this.style.background='#f0e8df'" onmouseout="this.style.background='var(--bg-canvas)'">✕</button>
            </div>
            <form id="ingredientForm" onsubmit="saveIngredient(event)">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">
                    <div style="grid-column:1/-1;">
                        <label class="form-label">Name *</label>
                        <input type="text" id="fieldName" required class="form-input" placeholder="e.g. Chinigura Rice">
                    </div>
                    <div>
                        <label class="form-label">Unit *</label>
                        <input type="text" id="fieldUnit" required class="form-input" placeholder="kg / L / pcs">
                    </div>
                    <div>
                        <label class="form-label">Current Stock *</label>
                        <input type="number" id="fieldStock" required step="0.01" min="0" class="form-input" placeholder="0.0">
                    </div>
                    <div>
                        <label class="form-label">Min Stock *</label>
                        <input type="number" id="fieldMinStock" required step="0.01" min="0" class="form-input" placeholder="0.0">
                    </div>
                    <div>
                        <label class="form-label">Cost / Unit (৳) *</label>
                        <input type="number" id="fieldCost" required step="0.01" min="0" class="form-input" placeholder="0.00">
                    </div>
                    <div>
                        <label class="form-label">Expiry Date</label>
                        <input type="date" id="fieldExpiry" class="form-input">
                    </div>
                </div>
                <div id="formError" style="display:none; color:#e11d48; font-size:0.82rem; font-weight:600; margin-bottom:0.75rem; padding:0.5rem 0.75rem; background:#fdf2f4; border-radius:0.65rem;"></div>
                <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

<style>
.form-label { display:block; font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.05em; }
.form-input { width:100%; padding:0.65rem 0.9rem; border:1px solid var(--border-color); border-radius:0.75rem; font-size:0.9rem; font-family:inherit; color:var(--text-main); background:var(--bg-canvas); outline:none; transition: border-color 0.2s, box-shadow 0.2s; }
.form-input:focus { border-color:var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.action-btn { border:none; cursor:pointer; border-radius:9999px; padding:0.3rem 0.7rem; font-size:0.75rem; font-weight:700; transition:all 0.15s; font-family:inherit; }
@keyframes rowIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
tbody tr { animation: rowIn 0.2s ease; }
</style>

<script>
let allIngredients = [];

document.addEventListener('DOMContentLoaded', () => {
    loadIngredients();
    loadDashboardAlerts();
});

async function loadIngredients() {
    try {
        const res = await fetch('/api/v1/ingredients');
        if (!res.ok) throw new Error('Failed to load ingredients');
        allIngredients = await res.json();
        updateStats(allIngredients);
        renderTable(allIngredients);
    } catch (e) {
        document.getElementById('ingredientTableBody').innerHTML = `
            <tr><td colspan="8" style="text-align:center; padding:2rem; color:#e11d48;">
                ⚠️ Failed to load ingredients. Please refresh.
            </td></tr>`;
    }
}

async function loadDashboardAlerts() {
    try {
        const res = await fetch('/api/v1/dashboard/summary');
        if (!res.ok) return;
        const data = await res.json();
        const low = data.lowStockCount || 0;
        const exp = data.expiringSoonCount || 0;
        if (low > 0 || exp > 0) {
            const parts = [];
            if (low > 0) parts.push(`<strong>${low}</strong> item${low>1?'s':''} below minimum stock`);
            if (exp > 0) parts.push(`<strong>${exp}</strong> item${exp>1?'s':''} expiring within 3 days`);
            document.getElementById('alertBannerText').innerHTML = parts.join(' &nbsp;•&nbsp; ');
            document.getElementById('alertBanner').style.display = 'flex';
        }
    } catch (_) {}
}

function updateStats(items) {
    const total = items.length;
    const low = items.filter(i => i.currentStock <= i.minimumStock).length;
    const today = new Date();
    const threeDays = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
    const expiring = items.filter(i => {
        if (!i.expiryDate) return false;
        const d = new Date(i.expiryDate);
        return d >= today && d <= threeDays;
    }).length;
    const val = items.reduce((sum, i) => sum + (i.currentStock || 0) * (i.costPerUnit || 0), 0);

    document.getElementById('statTotalVal').textContent = total;
    document.getElementById('statLowVal').textContent = low;
    document.getElementById('statExpiringVal').textContent = expiring;
    document.getElementById('statValueVal').textContent = '৳ ' + Math.round(val).toLocaleString();
}

function getStatusBadge(ingredient) {
    if (ingredient.currentStock === 0) {
        return `<span class="badge-danger">Out of Stock</span>`;
    }
    const today = new Date();
    const daysToExpiry = ingredient.expiryDate
        ? Math.ceil((new Date(ingredient.expiryDate) - today) / (1000 * 60 * 60 * 24))
        : null;
    if (daysToExpiry !== null && daysToExpiry <= 3) {
        return `<span class="badge-danger">Expires in ${daysToExpiry}d</span>`;
    }
    if (ingredient.currentStock <= ingredient.minimumStock) {
        return `<span class="badge-warning">Low Stock</span>`;
    }
    if (ingredient.currentStock <= ingredient.minimumStock * 1.3) {
        return `<span class="badge-warning">Near Minimum</span>`;
    }
    return `<span class="badge-success">In Stock</span>`;
}

function getStatusKey(ingredient) {
    if (ingredient.currentStock === 0) return 'critical';
    if (ingredient.currentStock <= ingredient.minimumStock) return 'low';
    return 'ok';
}

function renderTable(items) {
    const tbody = document.getElementById('ingredientTableBody');
    if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2.5rem;color:var(--text-muted);">
            <div style="font-size:1.75rem;margin-bottom:0.5rem;">📦</div>No ingredients found</td></tr>`;
        return;
    }

    tbody.innerHTML = items.map(i => `
        <tr data-status="${getStatusKey(i)}" data-name="${(i.name||'').toLowerCase()}">
            <td style="font-weight:700; color:var(--text-main); font-size:0.88rem;">${i.name}</td>
            <td style="font-weight:800; color: ${i.currentStock <= i.minimumStock ? '#f43f5e' : '#10b981'};">${i.currentStock?.toFixed(1)}</td>
            <td style="color:var(--text-muted); font-size:0.82rem;">${i.unit}</td>
            <td style="font-size:0.82rem;">${i.minimumStock?.toFixed(1)} ${i.unit}</td>
            <td style="font-weight:700;">৳ ${i.costPerUnit?.toFixed(2)}</td>
            <td>${i.expiryDate ? `<span style="font-size:0.82rem;">${i.expiryDate}</span>` : '<span style="color:var(--text-muted); font-size:0.8rem;">—</span>'}</td>
            <td>${getStatusBadge(i)}</td>
            <td style="text-align:right;">
                <div style="display:inline-flex; gap:0.4rem;">
                    <button class="action-btn" onclick="openEditModal(${i.id})" style="background:#f1f5f9; color:#0f172a;" title="Edit">✏️ Edit</button>
                    <button class="action-btn" onclick="deleteIngredient(${i.id}, '${i.name}')" style="background:#fee2e2; color:#ef4444;" title="Delete">🗑</button>
                </div>
            </td>
        </tr>`).join('');
}

function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allIngredients.filter(i => {
        const matchQ = !q || (i.name||'').toLowerCase().includes(q);
        const matchStatus = status === 'all' || getStatusKey(i) === status;
        return matchQ && matchStatus;
    });
    renderTable(filtered);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAddModal() {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Add Ingredient';
    document.getElementById('fieldName').value = '';
    document.getElementById('fieldUnit').value = '';
    document.getElementById('fieldStock').value = '';
    document.getElementById('fieldMinStock').value = '';
    document.getElementById('fieldCost').value = '';
    document.getElementById('fieldExpiry').value = '';
    document.getElementById('formError').style.display = 'none';
    showModal();
}

function openEditModal(id) {
    const item = allIngredients.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('modalTitle').textContent = 'Edit Ingredient';
    document.getElementById('fieldName').value = item.name || '';
    document.getElementById('fieldUnit').value = item.unit || '';
    document.getElementById('fieldStock').value = item.currentStock ?? '';
    document.getElementById('fieldMinStock').value = item.minimumStock ?? '';
    document.getElementById('fieldCost').value = item.costPerUnit ?? '';
    document.getElementById('fieldExpiry').value = item.expiryDate || '';
    document.getElementById('formError').style.display = 'none';
    showModal();
}

function showModal() {
    const modal = document.getElementById('ingredientModal');
    modal.style.display = 'flex';
    requestAnimationFrame(() => {
        modal.style.opacity = '1';
        document.getElementById('modalBox').style.transform = 'translateY(0)';
    });
    document.getElementById('fieldName').focus();
}

function closeModal() {
    const modal = document.getElementById('ingredientModal');
    modal.style.opacity = '0';
    document.getElementById('modalBox').style.transform = 'translateY(12px)';
    setTimeout(() => { modal.style.display = 'none'; }, 250);
}

async function saveIngredient(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const btn = document.getElementById('saveBtn');
    const errBox = document.getElementById('formError');
    errBox.style.display = 'none';

    const payload = {
        name: document.getElementById('fieldName').value.trim(),
        unit: document.getElementById('fieldUnit').value.trim(),
        currentStock: parseFloat(document.getElementById('fieldStock').value),
        minimumStock: parseFloat(document.getElementById('fieldMinStock').value),
        costPerUnit: parseFloat(document.getElementById('fieldCost').value),
        expiryDate: document.getElementById('fieldExpiry').value || null
    };

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
        const url  = id ? `/api/v1/ingredients/${id}` : '/api/v1/ingredients';
        const method = id ? 'PUT' : 'POST';
        const res  = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || 'Save failed');
        }

        closeModal();
        await loadIngredients();
    } catch (err) {
        errBox.textContent = '❌ ' + err.message;
        errBox.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Save`;
    }
}

async function deleteIngredient(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
        const res = await fetch(`/api/v1/ingredients/${id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error('Delete failed');
        await loadIngredients();
    } catch (e) {
        alert('❌ ' + e.message);
    }
}
</script>
</div>
</body>
</html>
