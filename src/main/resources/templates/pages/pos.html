<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Point of Sale', 'pos')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Point of Sale</h1>
    </div>

    <div class="pos-container">
        <!-- Left Side: Menu Grid & Categories -->
        <div>
            <!-- Category Filter Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active">All</button>
                <button class="tab-btn">Mains</button>
                <button class="tab-btn">Appetizers</button>
                <button class="tab-btn">Drinks</button>
                <button class="tab-btn">Desserts</button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid">
                <div class="menu-card">
                    <div class="menu-card-title">Grilled Chicken</div>
                    <div class="menu-card-price">$14.99</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Beef Burger</div>
                    <div class="menu-card-price">$12.50</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Pasta Alfredo</div>
                    <div class="menu-card-price">$13.99</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Caesar Salad</div>
                    <div class="menu-card-price">$8.99</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Fresh Lemonade</div>
                    <div class="menu-card-price">$4.50</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Chocolate Cake</div>
                    <div class="menu-card-price">$6.50</div>
                </div>
            </div>
        </div>

        <!-- Right Side: Cart Summary -->
        <div class="cart-panel">
            <div class="panel-header" style="margin-bottom: 0;">
                <h2 class="panel-title">Order #1043</h2>
                <span class="badge-success">Active</span>
            </div>

            <!-- Cart Items List -->
            <div class="cart-items">
                <div class="cart-item">
                    <div class="cart-item-name">Grilled Chicken (1x)</div>
                    <div class="cart-item-price">$14.99</div>
                </div>

                <div class="cart-item">
                    <div class="cart-item-name">Fresh Lemonade (1x)</div>
                    <div class="cart-item-price">$4.50</div>
                </div>
            </div>

            <!-- Cart Financial Totals -->
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Subtotal</span>
                    <span>$19.49</span>
                </div>
                <div class="cart-summary-row">
                    <span>Tax (10%)</span>
                    <span>$1.95</span>
                </div>
                <div class="cart-summary-row total">
                    <span>Total</span>
                    <span>$21.44</span>
                </div>
            </div>

            <button class="btn-primary" style="width: 100%;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Place Order
            </button>
        </div>
    </div>
</div>

</body>
</html>
