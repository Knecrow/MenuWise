<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Point of Sale', 'pos')}">
<body>

<div th:fragment="mainContent">
    <div class="page-header">
        <h1 class="page-title">Point of Sale</h1>
    </div>

    <div class="pos-container">
        <!-- Left Side: Menu Grid & Categories -->
        <div>
            <!-- Category Filter Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active">All</button>
                <button class="tab-btn">Mains</button>
                <button class="tab-btn">Appetizers</button>
                <button class="tab-btn">Drinks</button>
                <button class="tab-btn">Desserts</button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid">
                <div class="menu-card">
                    <div class="menu-card-title">Kacchi Biryani</div>
                    <div class="menu-card-price">৳ 450</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Fish &amp; Chips</div>
                    <div class="menu-card-price">৳ 520</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Chicken Roast &amp; Polao</div>
                    <div class="menu-card-price">৳ 380</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Shepherd's Pie</div>
                    <div class="menu-card-price">৳ 480</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Royal Borhani</div>
                    <div class="menu-card-price">৳ 120</div>
                </div>

                <div class="menu-card">
                    <div class="menu-card-title">Mishti Doi &amp; Rasgulla</div>
                    <div class="menu-card-price">৳ 150</div>
                </div>
            </div>
        </div>

        <!-- Right Side: Cart Summary -->
        <div class="cart-panel">
            <div class="panel-header" style="margin-bottom: 0;">
                <h2 class="panel-title">Order #1043</h2>
                <span class="badge-success">Active</span>
            </div>

            <!-- Cart Items List -->
            <div class="cart-items">
                <div class="cart-item">
                    <div class="cart-item-name">Kacchi Biryani (1x)</div>
                    <div class="cart-item-price">৳ 450</div>
                </div>

                <div class="cart-item">
                    <div class="cart-item-name">Royal Borhani (1x)</div>
                    <div class="cart-item-price">৳ 120</div>
                </div>
            </div>

            <!-- Cart Financial Totals -->
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Subtotal</span>
                    <span>৳ 570</span>
                </div>
                <div class="cart-summary-row">
                    <span>VAT / Tax (10%)</span>
                    <span>৳ 57</span>
                </div>
                <div class="cart-summary-row total">
                    <span>Total</span>
                    <span>৳ 627</span>
                </div>
            </div>

            <button class="btn-primary" style="width: 100%;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Place Order
            </button>
        </div>
    </div>
</div>

</body>
</html>
