<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::mainContent}, 'Rescue Menu', 'rescue')}">
<body>
<div th:fragment="mainContent">

    <div class="sub-header-bar">
        <div class="sub-header-left">
            <h1 class="sub-header-title">Rescue Menu</h1>
        </div>
        <div class="sub-header-right">
            <a th:href="@{/pos}" class="btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                POS Specials
            </a>
        </div>
    </div>

    <!-- 4 Purposeful Stat Tiles -->
    <div class="grid-stats">
        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">At-Risk Items</span>
                <div class="card-stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statAtRisk">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">HIGH Risk</span>
                <div class="card-stat-icon" style="color:#f43f5e; background:#ffe4e6;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </div>
            </div>
            <div class="card-stat-value" style="color:#f43f5e;" id="statHigh">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Active Specials</span>
                <div class="card-stat-icon" style="color:#10b981; background:#dcfce7;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statSpecials">—</div>
        </div>

        <div class="card-stat">
            <div class="card-stat-header">
                <span class="card-stat-title">Est. Waste Value</span>
                <div class="card-stat-icon" style="color:#3b82f6; background:#eff6ff;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
            </div>
            <div class="card-stat-value" id="statWasteVal">—</div>
        </div>
    </div>

    <!-- Rescue Proposals Section -->
    <div class="card-panel" style="padding:0; overflow:hidden; margin-bottom:1.25rem;">
        <div style="padding:1rem 1.35rem; border-bottom:1px solid rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center;">
            <h3 class="card-panel-title" style="margin:0;">Rescue Dish Promotions</h3>
            <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">Dynamic Specials</span>
        </div>
        <div id="proposalsContainer" style="padding:1.25rem;">
            <div style="text-align:center; padding:1.5rem; color:var(--text-muted);">
                <div style="font-size:1.5rem; margin-bottom:0.5rem;">🔄</div>Loading rescue proposals...
            </div>
        </div>
    </div>

    <!-- Spoilage Forecast Table -->
    <div class="card-panel" style="padding:0; overflow:hidden;">
        <div style="padding:1rem 1.35rem; border-bottom:1px solid rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center;">
            <h3 class="card-panel-title" style="margin:0;">Full Spoilage Forecast</h3>
            <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">7-Day Projected Waste</span>
        </div>
        <div class="table-responsive">
            <table class="calescence-table">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Current Stock</th>
                        <th>Predicted Waste</th>
                        <th>Spoilage Risk</th>
                        <th style="text-align:right;">Risk Tier</th>
                    </tr>
                </thead>
                <tbody id="forecastTableBody">
                    <tr><td colspan="5" style="text-align:center;padding:2.5rem;color:var(--text-muted);">Loading forecast...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<style>
.proposal-bento-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 1.15rem;
    padding: 1.15rem;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
    transition: transform 0.18s ease;
}
.proposal-bento-card:hover { transform: translateY(-1px); }
.risk-pill-bar { height: 6px; border-radius: 9999px; background: #f1f5f9; overflow: hidden; }
.risk-pill-fill { height: 100%; border-radius: 9999px; }
</style>

<script>
document.addEventListener('DOMContentLoaded', loadRescueData);

async function loadRescueData() {
    try {
        const [proposalsRes, forecastRes] = await Promise.all([
            fetch('/api/v1/rescue/proposals'),
            fetch('/api/v1/rescue/spoilage-forecast')
        ]);
        const proposals = await proposalsRes.json();
        const forecast  = await forecastRes.json();

        renderStats(proposals, forecast);
        renderProposals(proposals);
        renderForecastTable(forecast);
    } catch (e) {
        document.getElementById('proposalsContainer').innerHTML = `<div style="color:#e11d48; text-align:center; padding:2rem;">⚠️ Failed to load rescue data.</div>`;
    }
}

function renderStats(proposals, forecast) {
    const atRisk   = forecast.filter(f => f.riskTier !== 'LOW').length;
    const high     = forecast.filter(f => f.riskTier === 'HIGH').length;
    const specials = [...new Set(proposals.map(p => p.suggestedItemId))].length;
    const wasteVal = forecast.reduce((s, f) => s + (f.predictedWasteQty || 0) * 50, 0);

    document.getElementById('statAtRisk').textContent    = atRisk;
    document.getElementById('statHigh').textContent      = high;
    document.getElementById('statSpecials').textContent  = specials;
    document.getElementById('statWasteVal').textContent  = `৳ ${Math.round(wasteVal).toLocaleString()}`;
}

function renderProposals(proposals) {
    const container = document.getElementById('proposalsContainer');
    if (proposals.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted);">
            <div style="font-size:2rem; margin-bottom:0.75rem;">✅</div>
            <p style="font-weight:700;">No at-risk ingredients right now</p>
            <p style="font-size:0.82rem; margin-top:0.25rem;">All inventory is in good condition</p>
        </div>`;
        return;
    }

    const grouped = {};
    proposals.forEach(p => {
        if (!grouped[p.ingredientId]) grouped[p.ingredientId] = { ...p, dishes: [] };
        grouped[p.ingredientId].dishes.push({ id: p.suggestedItemId, name: p.suggestedItemName, original: p.originalPrice, rescue: p.rescuePrice, discount: p.discountPercentage });
    });

    const riskBadges = { HIGH: 'badge-danger', MEDIUM: 'badge-warning', LOW: 'badge-growth' };

    container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem;">
        ${Object.values(grouped).map(g => `
        <div class="proposal-bento-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem;">
                <div>
                    <div style="font-size:0.92rem; font-weight:800; color:var(--text-main);">${g.ingredientName}</div>
                    <div style="font-size:0.76rem; color:var(--text-muted);">Stock: ${g.currentStock?.toFixed(1)} ${g.expiryDate ? `• Expires: ${g.expiryDate}` : ''}</div>
                </div>
                <span class="${riskBadges[g.riskTier] || 'badge-growth'}">${g.riskTier} RISK</span>
            </div>
            <div style="margin-top:0.65rem; border-top:1px solid rgba(0,0,0,0.04); padding-top:0.5rem;">
                ${g.dishes.map(d => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.35rem 0;">
                    <span style="font-size:0.83rem; font-weight:700; color:var(--text-main);">${d.name}</span>
                    <div style="text-align:right;">
                        <span style="text-decoration:line-through; color:var(--text-muted); font-size:0.75rem;">৳ ${d.original?.toFixed(0)}</span>
                        <span style="font-size:0.88rem; font-weight:800; color:var(--text-main); margin-left:0.35rem;">৳ ${d.rescue?.toFixed(0)}</span>
                        <span class="badge-lime" style="margin-left:0.35rem;">-${d.discount?.toFixed(0)}%</span>
                    </div>
                </div>`).join('')}
            </div>
        </div>`).join('')}
    </div>`;
}

function renderForecastTable(forecast) {
    const tbody = document.getElementById('forecastTableBody');
    if (forecast.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted);">No data</td></tr>`;
        return;
    }

    const tierBadge = { HIGH: 'badge-danger', MEDIUM: 'badge-warning', LOW: 'badge-growth' };
    const tierColor = { HIGH: '#f43f5e', MEDIUM: '#f59e0b', LOW: '#10b981' };

    tbody.innerHTML = forecast.map(f => {
        const barColor = tierColor[f.riskTier] || '#94a3b8';
        return `<tr>
            <td style="font-weight:700; font-size:0.88rem;">${f.ingredientName}</td>
            <td style="font-size:0.84rem;">${f.currentStock?.toFixed(2)}</td>
            <td style="color:#f43f5e; font-weight:800; font-size:0.88rem;">${f.predictedWasteQty?.toFixed(2)}</td>
            <td>
                <div style="display:flex; align-items:center; gap:0.6rem;">
                    <div class="risk-pill-bar" style="flex:1; min-width:80px;">
                        <div class="risk-pill-fill" style="width:${f.spoilageRiskPercentage?.toFixed(0) || 0}%; background:${barColor};"></div>
                    </div>
                    <span style="font-size:0.8rem; font-weight:800; color:${barColor};">${f.spoilageRiskPercentage?.toFixed(0)}%</span>
                </div>
            </td>
            <td style="text-align:right;"><span class="${tierBadge[f.riskTier] || 'badge-growth'}">${f.riskTier}</span></td>
        </tr>`;
    }).join('');
}
</script>
</div>
</body>
</html>
